spring:
  application:
    name: alzada
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/inmobiliaria}
    username: ${DATABASE_USER:inmobiliaria_app}
    password: ${DATABASE_PASSWORD:alzada-local-app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    user: ${FLYWAY_USER:inmobiliaria}
    password: ${FLYWAY_PASSWORD:alzada-local-owner}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.json_format_mapper: jackson
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

alzada:
  jwt-secret: ${JWT_SECRET:}
  jwt-access-minutes: ${JWT_ACCESS_MINUTES:15}
  jwt-refresh-days: ${JWT_REFRESH_DAYS:14}
  cookie-secure: ${COOKIE_SECURE:false}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  public-url: ${APP_PUBLIC_URL:http://localhost:4200}
  storage:
    type: ${STORAGE_TYPE:s3}
    local-dir: ${STORAGE_LOCAL_DIR:./data/storage}
    s3-endpoint: ${S3_ENDPOINT:http://localhost:9000}
    s3-region: ${S3_REGION:us-east-1}
    s3-bucket: ${S3_BUCKET:alzada}
    s3-access-key: ${S3_ACCESS_KEY:alzada}
    s3-secret-key: ${S3_SECRET_KEY:alzada-local-secret}
    s3-path-style: ${S3_PATH_STYLE:true}
  uploads:
    logo-max-bytes: ${LOGO_MAX_BYTES:2097152}
    image-max-bytes: ${IMAGE_MAX_BYTES:8388608}
    document-max-bytes: ${DOCUMENT_MAX_BYTES:15728640}
  reservations:
    default-hours: ${RESERVATION_HOURS:72}
    expiring-notice-hours: 48
  notifications:
    email-enabled: ${EMAIL_ENABLED:true}
    from: ${MAIL_FROM:Alzada <no-reply@alzada.local>}
    whatsapp-enabled: ${WHATSAPP_ENABLED:false}
    reminder-days: 3
  platform-admin:
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
    name: ${PLATFORM_ADMIN_NAME:Administrador de la plataforma}

logging:
  level:
    root: INFO
    rd.alzada: INFO
    org.hibernate.SQL: WARN
